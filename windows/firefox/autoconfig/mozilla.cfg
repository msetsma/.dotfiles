// Firefox ignores the first line of this file.
// Make Glance the real new-tab page: the address bar stays empty and focused,
// unlike extension-based overrides that show the URL and steal focus.
try {
  const { AboutNewTab } = ChromeUtils.importESModule(
    "resource:///modules/AboutNewTab.sys.mjs"
  );
  AboutNewTab.newTabURL = "http://localhost:8280/";
} catch (e) {
  Cu.reportError(e);
}
