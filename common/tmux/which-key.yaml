# tmux-which-key config — popup keybind menu
# Symlinked by dotter to ~/.tmux/plugins/tmux-which-key/config.yaml
# Activates on prefix + Space (set via keybindings.prefix_table).
# Schema: https://github.com/alexwforsythe/tmux-which-key/blob/main/config.schema.yaml

keybindings:
  prefix_table: Space

title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=#939ab7,align=centre,bold

position:
  x: C
  y: C

items:
  - name: +Panes
    key: p
    menu:
      - { name: Left,  key: h, command: select-pane -L, transient: true }
      - { name: Down,  key: j, command: select-pane -D, transient: true }
      - { name: Up,    key: k, command: select-pane -U, transient: true }
      - { name: Right, key: l, command: select-pane -R, transient: true }
      - separator: true
      - { name: Split horizontal, key: v, command: "split-window -h -c #{pane_current_path}" }
      - { name: Split vertical,   key: s, command: "split-window -v -c #{pane_current_path}" }
      - { name: Zoom,             key: z, command: resize-pane -Z }
      - { name: Kill,             key: x, command: kill-pane }

  - name: +Windows
    key: w
    menu:
      - { name: Next,     key: n, command: next-window,     transient: true }
      - { name: Previous, key: p, command: previous-window, transient: true }
      - { name: Last,     key: tab, command: last-window }
      - separator: true
      - { name: New,    key: c, command: "new-window -c #{pane_current_path}" }
      - { name: Rename, key: R, command: command-prompt -I "#W" "rename-window -- \"%%\"" }
      - { name: Kill,   key: X, command: 'confirm -p "kill window #W? (y/n)" kill-window' }
      - separator: true
      - name: +Jump
        key: j
        menu:
          - { name: "1", key: "1", command: select-window -t 1 }
          - { name: "2", key: "2", command: select-window -t 2 }
          - { name: "3", key: "3", command: select-window -t 3 }
          - { name: "4", key: "4", command: select-window -t 4 }
          - { name: "5", key: "5", command: select-window -t 5 }
          - { name: "6", key: "6", command: select-window -t 6 }
          - { name: "7", key: "7", command: select-window -t 7 }
          - { name: "8", key: "8", command: select-window -t 8 }
          - { name: "9", key: "9", command: select-window -t 9 }

  - name: +Resize
    key: r
    menu:
      - { name: Left  ±5,  key: h, command: resize-pane -L 5,  transient: true }
      - { name: Down  ±5,  key: j, command: resize-pane -D 5,  transient: true }
      - { name: Up    ±5,  key: k, command: resize-pane -U 5,  transient: true }
      - { name: Right ±5,  key: l, command: resize-pane -R 5,  transient: true }
      - { name: Left  ±10, key: H, command: resize-pane -L 10, transient: true }
      - { name: Down  ±10, key: J, command: resize-pane -D 10, transient: true }
      - { name: Up    ±10, key: K, command: resize-pane -U 10, transient: true }
      - { name: Right ±10, key: L, command: resize-pane -R 10, transient: true }

  - name: +Sessions
    key: s
    menu:
      - { name: SessionX (rich),    key: o, command: "run-shell ~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh" }
      - { name: fzf switch,         key: s, command: "display-popup -E -w 60% -h 60% 'tmux list-sessions -F \"#S\" | fzf --reverse --prompt=\"session> \" | xargs -r tmux switch-client -t'" }
      - { name: fzf window-jump,    key: w, command: "display-popup -E -w 80% -h 60% 'tmux list-windows -a -F \"#S:#I  #W\" | fzf --reverse --prompt=\"window> \" | awk \"{print \\$1}\" | xargs -r tmux switch-client -t'" }
      - { name: New session,        key: c, command: "command-prompt -p \"session name:\" \"new-session -d -s '%%' ; switch-client -t '%%'\"" }
      - { name: Rename session,     key: R, command: "command-prompt -I \"#S\" \"rename-session -- '%%'\"" }
      - { name: Kill session,       key: X, command: "confirm-before -p \"kill session #S? (y/n)\" kill-session" }
      - { name: Detach,             key: d, command: detach-client }

  - separator: true

  - { name: Agent sidebar,       key: e, command: 'run-shell "\"#{@agent_sidebar_bin}\" toggle \"#{window_id}\" \"#{pane_current_path}\""' }
  - { name: All agent sidebars,   key: E, command: 'run-shell "\"#{@agent_sidebar_bin}\" toggle-all"' }
  - { name: Copy mode,           key: "[", command: copy-mode }
  - { name: Paste,               key: "]", command: paste-buffer }
  - { name: Reload config,       key: r,   command: "source-file ~/.tmux.conf ; display reloaded" }
  - { name: List all keys,       key: "?", command: "display-popup -E -h 80% -w 80% 'tmux list-keys -N | sort | less'" }
