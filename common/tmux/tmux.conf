# tmux config — WSL/Moshi primary, zellij-style UX
#
# Layout note: tmux's `status-position` is global — all status lines stack
# at one position. We use `status-position bottom` with two lines and put
# tabs on line 1 (visually upper) and the mode hint on line 0 (very bottom)
# to approximate zellij's tabs-above / hint-below rhythm. Flipping to
# `status-position top` moves the hint up too, which breaks the look.

# Prefix: C-a (frees C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 10
set -g status-keys vi
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#I: #W"

# Reload
bind r source-file ~/.tmux.conf \; display "reloaded"

# Splits keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keep cwd
bind c new-window -c "#{pane_current_path}"

# Vim-style pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switch (Alt+number, no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim-style copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# fzf session switcher (prefix + s) — fast path; sessionx is the rich variant on prefix+o
bind s display-popup -E -w 60% -h 60% "\
  tmux list-sessions -F '#S' \
  | grep -v \"^$(tmux display-message -p '#S')\$\" \
  | fzf --reverse --prompt='session> ' \
  | xargs -r tmux switch-client -t"

# fzf window switcher across all sessions (prefix + w)
bind w display-popup -E -w 80% -h 60% "\
  tmux list-windows -a -F '#S:#I  #W' \
  | fzf --reverse --prompt='window> ' \
  | awk '{print \$1}' \
  | xargs -r tmux switch-client -t"

# New session prompt (prefix + S)
bind S command-prompt -p "session name:" "new-session -d -s '%%' \; switch-client -t '%%'"

# Kill session quick (prefix + X)
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# === Catppuccin Mocha palette (hex constants for our custom format strings) ===
#   base       #1e1e2e   surface_0 #313244   surface_1 #45475a
#   text       #cdd6f4   subtext0  #a6adc8   overlay0  #6c7086
#   blue       #89b4fa   sapphire  #74c7ec   teal      #94e2d5
#   mauve      #cba6f7   peach     #fab387   lavender  #b4befe

# === Status bar — zellij-perceived layout (tabs row + bottom mode hint) ===
set -g status on
set -g status 2
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80

# Base style for both lines (overridden per format below)
set -g status-style "bg=#1e1e2e,fg=#a6adc8"

# --- Line 1 (visually upper): session badge + window tabs + cwd/clock ---
# Per-client: themed under local clients, plain under MOSHI_CLIENT so iOS swipe parses.
set -g status-format[1] "#{?#{!=:#{client_environment:MOSHI_CLIENT},},#[bg=#1e1e2e#,fg=#cdd6f4] #S #[default] #{W:#{?window_active,#[bg=#313244#,fg=#cdd6f4] #I:#W #[default],#[bg=#1e1e2e#,fg=#6c7086] #I:#W }}#[align=right]#[bg=#1e1e2e#,fg=#a6adc8] #(basename #{pane_current_path}) #[fg=#6c7086]│#[fg=#a6adc8] %H:%M ,#[fg=##cba6f7#,bg=##1e1e2e]▐#[fg=##cdd6f4#,bg=##cba6f7] #S #[fg=##cba6f7#,bg=##1e1e2e]▌ #{W:#{?window_active,#[fg=##cba6f7#,bg=##1e1e2e]▐#[fg=##cdd6f4#,bg=##cba6f7] #I:#W #[fg=##cba6f7#,bg=##1e1e2e]▌, #[fg=##6c7086#,bg=##1e1e2e]#I:#W  }}#[align=right]#[fg=##313244#,bg=##1e1e2e]▐#[fg=##cdd6f4#,bg=##313244] #(basename #{pane_current_path}) #[fg=##6c7086#,bg=##313244]│ %H:%M #[fg=##313244#,bg=##1e1e2e]▌}"

# --- Line 0 (very bottom): persistent mode hint, key-table aware ---
# Mode label colors:  PANE=teal  RESIZE=peach  TAB=mauve  default=blue
# Layout per mode:    [rounded-cap] LABEL [rounded-cap]  hint · hint · hint        right-align: ZOOM indicator
# Powerline glyphs ▐ ▌ require a Nerd Font; under MOSHI_CLIENT we drop to plain text so the iOS swipe gesture parses cleanly.
set -g status-format[0] "#[bg=##1e1e2e,fg=##a6adc8,align=left]#{?#{!=:#{client_environment:MOSHI_CLIENT},}, #{?#{==:#{client_key_table},PANE},[PANE] hjkl nav  s vsplit  v hsplit  x close  z zoom  Esc exit,#{?#{==:#{client_key_table},RESIZE},[RESIZE] hjkl ±5  HJKL ±10  Esc exit,#{?#{==:#{client_key_table},TAB},[TAB] 1-9 jump  np next/prev  c new  x close  Esc exit,[NORMAL] C-a + p panes  t tabs  R resize  o sessions  P float  ? help}}},#{?#{==:#{client_key_table},PANE},#[fg=##94e2d5#,bg=##1e1e2e]▐#[fg=##1e1e2e#,bg=##94e2d5] PANE #[fg=##94e2d5#,bg=##1e1e2e]▌ #[fg=##a6adc8#,bg=##1e1e2e]hjkl nav #[fg=##6c7086] · #[fg=##a6adc8]s vsplit #[fg=##6c7086] · #[fg=##a6adc8]v hsplit #[fg=##6c7086] · #[fg=##a6adc8]x close #[fg=##6c7086] · #[fg=##a6adc8]z zoom #[fg=##6c7086] · #[fg=##a6adc8]Esc exit,#{?#{==:#{client_key_table},RESIZE},#[fg=##fab387#,bg=##1e1e2e]▐#[fg=##1e1e2e#,bg=##fab387] RESIZE #[fg=##fab387#,bg=##1e1e2e]▌ #[fg=##a6adc8#,bg=##1e1e2e]hjkl ±5 #[fg=##6c7086] · #[fg=##a6adc8]HJKL ±10 #[fg=##6c7086] · #[fg=##a6adc8]Esc exit,#{?#{==:#{client_key_table},TAB},#[fg=##cba6f7#,bg=##1e1e2e]▐#[fg=##1e1e2e#,bg=##cba6f7] TAB #[fg=##cba6f7#,bg=##1e1e2e]▌ #[fg=##a6adc8#,bg=##1e1e2e]1-9 jump #[fg=##6c7086] · #[fg=##a6adc8]np next/prev #[fg=##6c7086] · #[fg=##a6adc8]c new #[fg=##6c7086] · #[fg=##a6adc8]x close #[fg=##6c7086] · #[fg=##a6adc8]Esc exit,#[fg=##89b4fa#,bg=##1e1e2e]▐#[fg=##1e1e2e#,bg=##89b4fa] NORMAL #[fg=##89b4fa#,bg=##1e1e2e]▌ #[fg=##a6adc8#,bg=##1e1e2e]C-a #[fg=##6c7086]+#[fg=##a6adc8] p panes #[fg=##6c7086] · #[fg=##a6adc8]t tabs #[fg=##6c7086] · #[fg=##a6adc8]R resize #[fg=##6c7086] · #[fg=##a6adc8]o sessions #[fg=##6c7086] · #[fg=##a6adc8]P float #[fg=##6c7086] · #[fg=##a6adc8]? help}}}#[align=right]#{?window_zoomed_flag,#[fg=##fab387#,bg=##1e1e2e]  ZOOM ,}}"

# Window tab styling (covers default-mode renders + activity)
set -g window-status-separator ""
set -g window-status-activity-style "fg=#fab387,bg=#1e1e2e"

# === Pane decoration — zellij-style ===
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#89b4fa]●#[default],○} #{pane_index} #{pane_current_command} "
set -g pane-border-lines single
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#45475a,fg=#cdd6f4"
set -g message-command-style "bg=#45475a,fg=#cdd6f4"

# Inherit Moshi-detection vars into new panes
set -ga update-environment "MOSHI_CLIENT TERM_PROGRAM LC_TERMINAL"

# === Zellij-style modes (sticky key tables + mode-colored active border) ===

# Enter modes — switch table AND tint active border to match mode
bind p switch-client -T PANE   \; set -g pane-active-border-style "fg=#94e2d5"
bind t switch-client -T TAB    \; set -g pane-active-border-style "fg=#cba6f7"
bind R switch-client -T RESIZE \; set -g pane-active-border-style "fg=#fab387"

# Help popup — list all bindings
bind ? display-popup -E -h 80% -w 80% "tmux list-keys -N | sort | less"

# --- PANE table ---
bind -T PANE h select-pane -L \; switch-client -T PANE
bind -T PANE j select-pane -D \; switch-client -T PANE
bind -T PANE k select-pane -U \; switch-client -T PANE
bind -T PANE l select-pane -R \; switch-client -T PANE
bind -T PANE s split-window -v -c "#{pane_current_path}" \; switch-client -T PANE
bind -T PANE v split-window -h -c "#{pane_current_path}" \; switch-client -T PANE
bind -T PANE x kill-pane \; switch-client -T PANE
bind -T PANE z resize-pane -Z \; switch-client -T PANE
bind -T PANE q      set -u key-table \; set -g pane-active-border-style "fg=#89b4fa"
bind -T PANE Escape set -u key-table \; set -g pane-active-border-style "fg=#89b4fa"

# --- RESIZE table ---
bind -T RESIZE h resize-pane -L 5 \; switch-client -T RESIZE
bind -T RESIZE j resize-pane -D 5 \; switch-client -T RESIZE
bind -T RESIZE k resize-pane -U 5 \; switch-client -T RESIZE
bind -T RESIZE l resize-pane -R 5 \; switch-client -T RESIZE
bind -T RESIZE H resize-pane -L 10 \; switch-client -T RESIZE
bind -T RESIZE J resize-pane -D 10 \; switch-client -T RESIZE
bind -T RESIZE K resize-pane -U 10 \; switch-client -T RESIZE
bind -T RESIZE L resize-pane -R 10 \; switch-client -T RESIZE
bind -T RESIZE q      set -u key-table \; set -g pane-active-border-style "fg=#89b4fa"
bind -T RESIZE Escape set -u key-table \; set -g pane-active-border-style "fg=#89b4fa"

# --- TAB (window) table ---
bind -T TAB 1 select-window -t 1 \; switch-client -T TAB
bind -T TAB 2 select-window -t 2 \; switch-client -T TAB
bind -T TAB 3 select-window -t 3 \; switch-client -T TAB
bind -T TAB 4 select-window -t 4 \; switch-client -T TAB
bind -T TAB 5 select-window -t 5 \; switch-client -T TAB
bind -T TAB 6 select-window -t 6 \; switch-client -T TAB
bind -T TAB 7 select-window -t 7 \; switch-client -T TAB
bind -T TAB 8 select-window -t 8 \; switch-client -T TAB
bind -T TAB 9 select-window -t 9 \; switch-client -T TAB
bind -T TAB n next-window     \; switch-client -T TAB
bind -T TAB p previous-window \; switch-client -T TAB
bind -T TAB c new-window -c "#{pane_current_path}" \; switch-client -T TAB
bind -T TAB x kill-window \; switch-client -T TAB
bind -T TAB q      set -u key-table \; set -g pane-active-border-style "fg=#89b4fa"
bind -T TAB Escape set -u key-table \; set -g pane-active-border-style "fg=#89b4fa"

# === TPM (tmux plugin manager) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect — preserve nvim sessions, shell history, pane contents
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# continuum — auto-save every 15min, auto-restore on tmux start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# --- Catppuccin theme (palette + module variables) ---
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_default_text  ' #W'
set -g @catppuccin_window_current_text  ' #W'
set -g @catppuccin_window_default_fill  'number'
set -g @catppuccin_window_current_fill  'number'

# --- Rich session manager (prefix + o) ---
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-mode 'on'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-x-path '~/'

# --- Floating scratchpad (prefix + P) ---
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'P'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'mauve'
set -g @floax-text-color 'blue'

# --- Which-key popup (prefix + Space by default) ---
set -g @plugin 'alexwforsythe/tmux-which-key'

# Auto-clone TPM on first run (plugins installed via `prefix + I`)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
