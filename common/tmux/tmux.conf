# Prefix: C-Space
unbind C-b
set -g prefix C-Space
bind C-a send-prefix

# General
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -sg escape-time 10
set -g status-keys vi
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#I: #W"
set -gw automatic-rename on
set -gw automatic-rename-format "#{b:pane_current_path}"
set -gw allow-rename off

# Reload
bind r source-file ~/.tmux.conf \; display "reloaded"

# Splits keep cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keep cwd
bind c new-window -c "#{pane_current_path}"

# Vim-style pane nav
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switch (Alt+number, no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Vim-style copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# fzf session switcher (prefix + s) — fast path; sessionx is the rich variant on prefix+o
bind s display-popup -E -w 60% -h 60% "\
  tmux list-sessions -F '#S' \
  | grep -v \"^$(tmux display-message -p '#S')\$\" \
  | fzf --reverse --prompt='session> ' \
  | xargs -r tmux switch-client -t"

# fzf window switcher across all sessions (prefix + w)
bind w display-popup -E -w 80% -h 60% "\
  tmux list-windows -a -F '#S:#I  #W' \
  | fzf --reverse --prompt='window> ' \
  | awk '{print \$1}' \
  | xargs -r tmux switch-client -t"

# New session prompt (prefix + S)
bind S command-prompt -p "session name:" "new-session -d -s '%%' \; switch-client -t '%%'"

# Kill session quick (prefix + X)
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# === Catppuccin Macchiato palette + muted tmux accents ===
#   base       #24273a   surface_0 #363a4f   surface_1 #494d64
#   text       #cad3f5   subtext0  #a5adcb   overlay0  #6e738d   overlay2 #939ab7
#   muted blue #aeb8d8   muted teal #8fb8b2   muted peach #d8bca8
#   lavender   #b7bdf8

# === Status bar — window tabs at top, mode hint in active pane border ===
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -gu status-format[1]

# Base style for the top status line.
set -g status-style "bg=#24273a,fg=#a5adcb"

# Clickable top window row. Under MOSHI_CLIENT we keep plain text so iOS swipe parses.
set -g status-format[0] "#{?#{!=:#{client_environment:MOSHI_CLIENT},},#[bg=#24273a]#[fg=#cad3f5] #S  #{W:#[range=window|#{window_index}]#{?window_active,#[bg=#363a4f]#[fg=#cad3f5] #I:#W #[default],#[bg=#24273a]#[fg=#6e738d] #I:#W }#[norange]}#[align=right]#[bg=#24273a]#[fg=#a5adcb] #(basename #{pane_current_path}) #[fg=#6e738d]|#[fg=#a5adcb] %H:%M ,#[bg=##24273a]#[fg=##363a4f]#[bg=##363a4f]#[fg=##b8c0e0] #S #[bg=##24273a]#[fg=##363a4f] #{W:#[range=window|#{window_index}]#{?window_active,#[bg=##24273a]#[fg=##b7bdf8]#[bg=##b7bdf8]#[fg=##24273a]#[bold] #I:#W #[nobold]#[bg=##24273a]#[fg=##b7bdf8],#[bg=##24273a]#[fg=##363a4f]#[bg=##363a4f]#[fg=##a5adcb] #I:#W #[bg=##24273a]#[fg=##363a4f]}#[norange]}}#[align=right]#[bg=##24273a]#[fg=##363a4f]#[bg=##363a4f]#[fg=##b8c0e0] #(basename #{pane_current_path}) #[fg=##6e738d]|#[fg=##b8c0e0] %H:%M #[bg=##24273a]#[fg=##363a4f]}"

# Window tab styling (covers default-mode renders + activity)
set -g window-status-separator ""
set -g window-status-activity-style "fg=#939ab7,bg=#24273a"

# === Pane decoration — zellij-style ===
set -g pane-border-status bottom
set -g pane-border-format "#{?pane_active,#{?client_prefix,#[bg=#24273a]#[fg=#939ab7]#[bg=#939ab7]#[fg=#24273a]#[bold] PREFIX #[nobold]#[bg=#24273a]#[fg=#939ab7] #[fg=#a5adcb]h/j/k/l pane #[fg=#6e738d]· #[fg=#a5adcb]e/E agents #[fg=#6e738d]· #[fg=#a5adcb]p/t/R modes #[fg=#6e738d]· #[fg=#a5adcb]o sessions #[fg=#6e738d]· #[fg=#a5adcb]s/w switch #[fg=#6e738d]· #[fg=#a5adcb]r reload #[fg=#6e738d]· #[fg=#a5adcb]? help,#{?#{==:#{client_key_table},PANE},#[bg=#24273a]#[fg=#8fb8b2]#[bg=#8fb8b2]#[fg=#24273a]#[bold] PANE #[nobold]#[bg=#24273a]#[fg=#8fb8b2] #[fg=#8fb8b2]hjkl pane #[fg=#6e738d]· #[fg=#8fb8b2]s down #[fg=#6e738d]· #[fg=#8fb8b2]v right #[fg=#6e738d]· #[fg=#8fb8b2]x close #[fg=#6e738d]· #[fg=#8fb8b2]z zoom #[fg=#6e738d]· #[fg=#8fb8b2]q/Esc exit,#{?#{==:#{client_key_table},RESIZE},#[bg=#24273a]#[fg=#d8bca8]#[bg=#d8bca8]#[fg=#24273a]#[bold] RESIZE #[nobold]#[bg=#24273a]#[fg=#d8bca8] #[fg=#d8bca8]hjkl resize 5 #[fg=#6e738d]· #[fg=#d8bca8]HJKL resize 10 #[fg=#6e738d]· #[fg=#d8bca8]q/Esc exit,#{?#{==:#{client_key_table},TAB},#[bg=#24273a]#[fg=#b7bdf8]#[bg=#b7bdf8]#[fg=#24273a]#[bold] TAB #[nobold]#[bg=#24273a]#[fg=#b7bdf8] #[fg=#b7bdf8]1-9 jump #[fg=#6e738d]· #[fg=#b7bdf8]n/p next/prev #[fg=#6e738d]· #[fg=#b7bdf8]c new #[fg=#6e738d]· #[fg=#b7bdf8]x close #[fg=#6e738d]· #[fg=#b7bdf8]q/Esc exit,#[bg=#24273a]#[fg=#aeb8d8]#[bg=#aeb8d8]#[fg=#24273a]#[bold] NORMAL #[nobold]#[bg=#24273a]#[fg=#aeb8d8] #[fg=#a5adcb]C-Space prefix #[fg=#6e738d]· #[fg=#a5adcb]M-1..9 tabs #[fg=#6e738d]· #[fg=#a5adcb]click top tabs}}}}#{?window_zoomed_flag, #[fg=#d8bca8]ZOOM,},#[fg=#6e738d]○ #{pane_index} #{pane_current_command}}"
set -g pane-border-lines single
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "#{?client_prefix,fg=#939ab7,#{?#{==:#{client_key_table},PANE},fg=#8fb8b2,#{?#{==:#{client_key_table},RESIZE},fg=#d8bca8,#{?#{==:#{client_key_table},TAB},fg=#b7bdf8,fg=#939ab7}}}}"

# Message style
set -g message-style "bg=#494d64,fg=#cad3f5"
set -g message-command-style "bg=#494d64,fg=#cad3f5"

# Inherit Moshi-detection vars into new panes
set -ga update-environment "MOSHI_CLIENT TERM_PROGRAM LC_TERMINAL"

# === Zellij-style modes (sticky key tables + mode-colored active border) ===

# Enter modes — switch table AND tint active border to match mode
bind p switch-client -T PANE
bind t switch-client -T TAB
bind R switch-client -T RESIZE

# Help popup — list all bindings
bind ? display-popup -E -h 80% -w 80% "tmux list-keys -N | sort | less"

# --- PANE table ---
bind -T PANE h select-pane -L \; switch-client -T PANE
bind -T PANE j select-pane -D \; switch-client -T PANE
bind -T PANE k select-pane -U \; switch-client -T PANE
bind -T PANE l select-pane -R \; switch-client -T PANE
bind -T PANE s split-window -v -c "#{pane_current_path}" \; switch-client -T PANE
bind -T PANE v split-window -h -c "#{pane_current_path}" \; switch-client -T PANE
bind -T PANE x kill-pane \; switch-client -T PANE
bind -T PANE z resize-pane -Z \; switch-client -T PANE
bind -T PANE q      set -u key-table
bind -T PANE Escape set -u key-table

# --- RESIZE table ---
bind -T RESIZE h resize-pane -L 5 \; switch-client -T RESIZE
bind -T RESIZE j resize-pane -D 5 \; switch-client -T RESIZE
bind -T RESIZE k resize-pane -U 5 \; switch-client -T RESIZE
bind -T RESIZE l resize-pane -R 5 \; switch-client -T RESIZE
bind -T RESIZE H resize-pane -L 10 \; switch-client -T RESIZE
bind -T RESIZE J resize-pane -D 10 \; switch-client -T RESIZE
bind -T RESIZE K resize-pane -U 10 \; switch-client -T RESIZE
bind -T RESIZE L resize-pane -R 10 \; switch-client -T RESIZE
bind -T RESIZE q      set -u key-table
bind -T RESIZE Escape set -u key-table

# --- TAB (window) table ---
bind -T TAB 1 select-window -t 1 \; switch-client -T TAB
bind -T TAB 2 select-window -t 2 \; switch-client -T TAB
bind -T TAB 3 select-window -t 3 \; switch-client -T TAB
bind -T TAB 4 select-window -t 4 \; switch-client -T TAB
bind -T TAB 5 select-window -t 5 \; switch-client -T TAB
bind -T TAB 6 select-window -t 6 \; switch-client -T TAB
bind -T TAB 7 select-window -t 7 \; switch-client -T TAB
bind -T TAB 8 select-window -t 8 \; switch-client -T TAB
bind -T TAB 9 select-window -t 9 \; switch-client -T TAB
bind -T TAB n next-window     \; switch-client -T TAB
bind -T TAB p previous-window \; switch-client -T TAB
bind -T TAB c new-window -c "#{pane_current_path}" \; switch-client -T TAB
bind -T TAB x kill-window \; switch-client -T TAB
bind -T TAB q      set -u key-table
bind -T TAB Escape set -u key-table

# === TPM (tmux plugin manager) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'

# agent sidebar — explicit bindings so prefix + e / E are documented locally
set -g @sidebar_key 'e'
set -g @sidebar_key_all 'E'
set -g @sidebar_auto_create 'off'
set -g @plugin 'hiroppy/tmux-agent-sidebar'

# resurrect — preserve nvim sessions, shell history, pane contents
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# continuum — auto-save every 5min, auto-restore on tmux start
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# --- Rich session manager (prefix + o) ---
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-mode 'on'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-x-path '~/'


if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
